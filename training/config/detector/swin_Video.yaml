# log dir
log_dir: /data/home/zhiyuanyan/DeepfakeBench/logs_debug/videoswin_baseline

# model setting
model_name: videoswin
backbone_name: null
pretrained: null

# backbone setting
backbone_config:
  mode: original
  num_classes: 2
  inc: 3
  dropout: false

# dataset
all_dataset: [FaceForensics++, FF-F2F, FF-DF, FF-FS, FF-NT, FaceShifter, DeepFakeDetection, Celeb-DF-v1, Celeb-DF-v2, DFDCP, DFDC, DeeperForensics-1.0, UADFV, WDF]
train_dataset: [FaceForensics++]
test_dataset: [FaceForensics++, Celeb-DF-v1, Celeb-DF-v2, DFDCP, DFDC, WDF, DeepFakeDetection, UADFV]

compression: c23

clip_size: 16
test_clip_size: 16

train_batchSize: 4
test_batchSize: 4
workers: 8

frame_num:
  train: 32
  test: 32

resolution: 224

video_mode: true
with_mask: false
with_landmark: false
with_flow: false

# data augmentation
use_data_augmentation: true
data_aug:
  flip_prob: 0.5
  rotate_prob: 0.5
  rotate_limit: [-10, 10]
  blur_prob: 0.5
  blur_limit: [3, 7]
  brightness_prob: 0.5
  brightness_limit: [-0.1, 0.1]
  contrast_limit: [-0.1, 0.1]
  quality_lower: 40
  quality_upper: 100

# normalization (ImageNet)
mean: [0.485, 0.456, 0.406]
std: [0.229, 0.224, 0.225]

#  optimizer config
optimizer:
  classifier_only: true
  type: adam
  adam:
    lr: 0.0002
    beta1: 0.9
    beta2: 0.999
    eps: 0.00000001
    weight_decay: 0.0005
    amsgrad: false


# training config
lr_scheduler: null
nEpochs: 10
start_epoch: 0
save_epoch: 1
rec_iter: 100
logdir: ./logs
manualSeed: 1024
save_ckpt: true
save_feat: true

# loss
loss_func: cross_entropy
losstype: null

# metric
metric_scoring: auc

# cuda
cuda: true
cudnn: true